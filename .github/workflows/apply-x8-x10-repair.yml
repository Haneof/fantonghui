name: apply-x8-x10-repair

on:
  push:
    branches:
      - arena/integrator-x8-x10-repair-20260915

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/integrator-x8-x10-repair-20260915
          fetch-depth: 0
      - name: Apply minimal repair
        run: python tools/apply_x8_x10_patch.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(m0): close X8-X10 boundary blockers"
          git push origin HEAD:arena/integrator-x8-x10-repair-20260915
