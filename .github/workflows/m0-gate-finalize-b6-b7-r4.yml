name: M0 Gate finalize B6 B7 B5 R4 candidate

on:
  push:
    branches:
      - arena/01a09bc6-fantonghui
    paths:
      - .github/workflows/m0-gate-finalize-b6-b7-r4.yml

permissions:
  contents: write

jobs:
  finalize-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Regenerate approved M0 structural snapshot
        run: |
          python - <<'PY'
          import json, runpy
          from pathlib import Path
          ns = runpy.run_path('tests/unit/contracts/test_m0_schema_snapshot.py')
          snapshot = ns['build_current_snapshot']()
          Path('schemas/r2/m0_contract_snapshot.json').write_text(
              json.dumps(snapshot, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          rm .github/workflows/m0-gate-finalize-b6-b7-r4.yml
      - name: Freeze candidate locally
        run: |
          git config user.name "chief-01"
          git config user.email "131862491+Haneof@users.noreply.github.com"
          git add -A
          git commit -m "M0 Gate candidate B6 B7 B5 R4 repaired"
          echo "EXACT_CANDIDATE=$(git rev-parse HEAD)"
      - name: Run exact candidate formal suite
        run: python -m pytest -v
      - name: Run exact candidate reference suite
        run: PYTHONPATH=aios_core_r2_reference/src python -m pytest aios_core_r2_reference/tests -v
      - name: Push exact tested candidate
        run: git push origin HEAD:arena/01a09bc6-fantonghui
