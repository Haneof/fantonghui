name: M0 Gate B10 B11 repair

on:
  push:
    branches:
      - arena/01a09bc6-fantonghui
    paths:
      - .github/workflows/m0-gate-b10-b11-patch.yml
      - tools/apply_m0_gate_b10_b11.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply B10 B11 repair
        run: python tools/apply_m0_gate_b10_b11.py
      - name: Commit semantic repair
        run: |
          git config user.name "chief-01"
          git config user.email "131862491+Haneof@users.noreply.github.com"
          git add -A
          git commit -m "M0 Gate patch B10 canonical dispatch and B11 mapping keys"
          git push origin HEAD:arena/01a09bc6-fantonghui
