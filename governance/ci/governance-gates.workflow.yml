# ⚠️ 这是一份 **workflow 模板**，不是生效的 workflow。
#
# 原因：本会话使用的 GitHub App 令牌没有 `workflows` 权限，push 含
# `.github/workflows/*` 的提交会被远端拒绝：
#   "refusing to allow a GitHub App to create or update workflow
#    `.github/workflows/governance-gates.yml` without `workflows` permission"
#
# 安装方式（需要有 workflows 权限的人执行，二选一）：
#   ① cp governance/ci/governance-gates.workflow.yml .github/workflows/governance-gates.yml && git commit && git push
#   ② 在 Arena 里为本仓库授予 GitHub App 的 workflows 权限后，由代理执行 ①
#
# 未安装期间，门本身仍然可用（本机 / 任何 CI 均可直接调用，stdlib-only，无需依赖安装）：
#   python3 governance/ci/run_gates.py --scale 100k        # 五道证据门（约 16 s）
#   python3 governance/ci/negative_self_test.py            # 11 场景负向自测（约 13 s）
# 两者的 canonical 运行工件已入库：governance/ci/evidence/
#
name: Governance & Evidence Gates (NUMCI-001 / PROBE-CI-002)

# 为什么单独一个 workflow：
#   ci.yml 跑的是产品测试（pytest，需要 pip install -e ".[dev]"）。
#   这里跑的是**治理与证据门**：编号 registry 完整性、设计书↔registry 一致性、
#   探针工件溯源、数字可追溯性。全部 stdlib-only（本仓库沙箱 pip 受 PEP 668 阻断，
#   治理门不得依赖第三方包），因此不需要 install 步骤。
#
# 语义约定（见设计书 §3.7.4）：
#   hard fail  = 工程正确性问题（哈希不符 / 溯源断裂 / slug 漂移 / 探针门失败 / 数字回潮）
#   治理债     = 号位未裁决造成的 CONFLICT / UNRATIFIED / gate 争议 —— 计入 baseline 并**只许减少**
#                （棘轮）。治理债**不**让本 workflow 变红：一个永远红的门等于没有门。

on:
  push:
    branches: [ "aios-2.0", "arena/*" ]
  pull_request:
    branches: [ "aios-2.0" ]
  workflow_dispatch:
    inputs:
      scale:
        description: "放行档：跑 1M 规模门（约 2~3 分钟，产出归档工件）"
        required: false
        default: "100k"
        type: choice
        options: [ "100k", "200k", "1m" ]

jobs:
  gates:
    name: Evidence gates (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 铁律 2：SLO 必须绑定 profile，解释器版本是 profile 的一部分 ⇒ 两个版本都跑。
        # registry.environment 记录：P1 声明目标 3.12，审计沙箱实测 3.11.2。
        python-version: [ "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record interpreter profile
        run: |
          python -V; python -c "import sqlite3,sys;print('sqlite',sqlite3.sqlite_version)"
      - name: Run governance & evidence gates (CI scale)
        run: |
          python governance/ci/run_gates.py \
            --scale "${{ github.event.inputs.scale || '100k' }}" \
            | tee governance/ci/evidence/gates_ci.log
      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-run-py${{ matrix.python-version }}
          path: |
            governance/ci/evidence/
            reviews/architecture/evidence/PROVENANCE.json
          if-no-files-found: warn

  gate-self-test:
    name: Negative self-test (does the gate bite?)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inject 8 violations into repo copies and require each gate to fire
        run: |
          python governance/ci/negative_self_test.py \
            | tee governance/ci/evidence/gate_self_test.log
      - name: Upload self-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-negative-self-test
          path: governance/ci/evidence/
          if-no-files-found: warn

  release-gate-1m:
    # 放行档：只在人工触发且 scale=1m 时跑（CI 档不得单独作为放行依据 —— 设计书 §3.7.1）
    name: Release-scale gate (1M)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.scale == '1m' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run probe at 1M and verify all artifacts
        run: |
          python governance/ci/run_gates.py --scale 1m \
            | tee governance/ci/evidence/gates_release_1m.log
      - name: Upload release-scale artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-release-1m
          path: |
            governance/ci/evidence/
            reviews/architecture/evidence/PROVENANCE.json
          if-no-files-found: warn
