        run: python tools/apply_m0_gate_b8_b9_patch.py
      - name: Commit semantic repair
        run: |
          git config user.name "chief-01"
          git config user.email "131862491+Haneof@users.noreply.github.com"
          git add -A
          git commit -m "M0 Gate patch B8 cross-process replay and SQLite busy classification"
