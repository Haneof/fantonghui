name: apply-cutoff-contract-compat

on:
  push:
    branches:
      - arena/integrator-x8-x10-repair-20260915

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/integrator-x8-x10-repair-20260915
          fetch-depth: 0
      - name: Apply compatibility fix
        run: python tools/fix_cutoff_contract_compat.py
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(m0): preserve naive cutoff contract while mapping overflow"
          git push origin HEAD:arena/integrator-x8-x10-repair-20260915
